[package]
name = "aethel_w3_eco"
version = "0.1.0"
entry = "src/main.aethel"

[dependencies]

[rust-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
rayon = "1.12"
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
regex = "1.13"
