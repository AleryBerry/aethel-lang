[package]
name = "rust_w3_eco"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
rayon = "1.12"
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
regex = "1.13"

[profile.release]
opt-level = 3
lto = "thin"
